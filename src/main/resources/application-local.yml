spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SEAL_DB_URL:jdbc:postgresql://localhost:5432/seal_dev?currentSchema=seal}
    username: ${SEAL_DB_USERNAME:seal_app}
    password: ${SEAL_DB_PASSWORD:}
  security:
    user:
      name: ${SEAL_ADMIN_USERNAME:seal-admin}
      password: ${SEAL_ADMIN_PASSWORD}
      roles: ADMIN

server:
  port: ${SEAL_SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: false

seal:
  mail:
    enabled: false
