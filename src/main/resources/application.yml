spring:
  application:
    name: seal
  profiles:
    default: local
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: seal-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
  mail:
    host: ${SEAL_SMTP_HOST:relay.govkorea.com}
    port: ${SEAL_SMTP_PORT:465}
    test-connection: false
    properties:
      mail.smtp.auth: false
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

mybatis:
  mapper-locations: classpath*:/mybatis/mappers/**/*.xml
  type-aliases-package: kr.or.arte.seal
  type-handlers-package: kr.or.arte.seal.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-statement-timeout: 10

server:
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

seal:
  evidence:
    root: ${SEAL_EVIDENCE_ROOT:target/seal-evidence}
    hmac-key-file: ${SEAL_EVIDENCE_HMAC_KEY_FILE:}
    worker-enabled: ${SEAL_EVIDENCE_WORKER_ENABLED:false}
  recipient-import:
    max-rows: ${SEAL_IMPORT_MAX_ROWS:1000}
    max-bytes: ${SEAL_IMPORT_MAX_BYTES:5242880}
  clamav:
    enabled: ${SEAL_CLAMAV_ENABLED:false}
    host: ${SEAL_CLAMAV_HOST:127.0.0.1}
    port: ${SEAL_CLAMAV_PORT:3310}
    timeout: ${SEAL_CLAMAV_TIMEOUT:5s}
  secure-link:
    hmac-key-file: ${SEAL_LINK_HMAC_KEY_FILE:}
  admin-security:
    max-login-failures: ${SEAL_ADMIN_MAX_LOGIN_FAILURES:5}
    temporary-lock-duration: ${SEAL_ADMIN_LOCK_DURATION:15m}
  bootstrap-admin:
    id: ${SEAL_BOOTSTRAP_ADMIN_ID:}
    name: ${SEAL_BOOTSTRAP_ADMIN_NAME:}
    password: ${SEAL_BOOTSTRAP_ADMIN_PASSWORD:}
  mail:
    enabled: ${SEAL_MAIL_ENABLED:false}
    host: ${SEAL_SMTP_HOST:relay.govkorea.com}
    port: ${SEAL_SMTP_PORT:465}
    ssl-enabled: true
    auth-enabled: false
    from-address: ${SEAL_MAIL_FROM_ADDRESS:no-reply@arte.or.kr}
    from-name: ${SEAL_MAIL_FROM_NAME:개인정보 동의 안내}
  personal-data:
    active-key-id: ${SEAL_DATA_ACTIVE_KEY_ID:}
    keys-file: ${SEAL_DATA_KEYS_FILE:}
    email-index-hmac-key-file: ${SEAL_EMAIL_INDEX_HMAC_KEY_FILE:}
